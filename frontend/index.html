<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elliot's Traffic Tools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d1a;
    --surface: #13132a;
    --surface2: #1a1a35;
    --accent: #e94560;
    --blue: #5a8adf;
    --text: #e8eaf0;
    --muted: #6b7280;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; padding: 40px; }
  .brand { text-align: center; }
  .brand h1 { font-size: 28px; font-weight: 800; letter-spacing: 2px; color: var(--accent); }
  .brand p { font-size: 13px; color: var(--muted); margin-top: 6px; letter-spacing: .5px; }
  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .tool-card { background: var(--surface); border: 1px solid #2a2a4a; border-radius: 14px; padding: 36px 40px; width: 240px; text-align: center; text-decoration: none; color: var(--text); transition: border-color .2s, transform .15s; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .tool-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tool-card .icon { font-size: 36px; }
  .tool-card h2 { font-size: 16px; font-weight: 700; }
  .tool-card p { font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
  <div class="brand">
    <h1>ELLIOT'S TRAFFIC TOOLS</h1>
    <p>Traffic Movement Count Tools</p>
  </div>
  <div class="cards">
    <a class="tool-card" href="corridor.html">
      <span class="icon">🛣️</span>
      <h2>Corridor Balancing</h2>
      <p>Visual intersection network with volume balancing and Synchro export</p>
    </a>
    <a class="tool-card" href="tmc.html">
      <span class="icon">📊</span>
      <h2>TMC Processor</h2>
      <p>Process count files, generate Illustrator CSVs, parse Synchro results</p>
    </a>
  </div>
</body>
</html>
